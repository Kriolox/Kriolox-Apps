name: Build Android APKs
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          accept-android-sdk-licenses: true
      - name: Install required Android platforms
        run: |
          sdkmanager --install "platforms;android-35"
          sdkmanager --install "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Bundle Three.js locally for offline WebView imports
        run: |
          mkdir -p /tmp/three-package KrioloxStudio/app/src/main/assets/three
          curl -L --fail --silent --show-error https://registry.npmjs.org/three/-/three-0.160.0.tgz | tar -xz -C /tmp/three-package --strip-components=1
          mkdir -p KrioloxStudio/app/src/main/assets/three/build KrioloxStudio/app/src/main/assets/three/examples
          cp /tmp/three-package/build/three.module.js KrioloxStudio/app/src/main/assets/three/build/
          cp -R /tmp/three-package/examples/jsm KrioloxStudio/app/src/main/assets/three/examples/
      - name: Build APKs
        run: gradle assembleDebug --stacktrace
      - name: Collect APKs
        run: |
          mkdir -p output
          cp Kriolox/app/build/outputs/apk/debug/app-debug.apk output/Kriolox.apk
          cp KrioloxStudio/app/build/outputs/apk/debug/app-debug.apk output/Kriolox-Studio.apk
          cp DRIPVERSE/app/build/outputs/apk/debug/app-debug.apk output/DRIPVERSE.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Android-APKs
          path: output/*.apk
          if-no-files-found: error
