name: Build Android APKs
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.7' }
      - name: Build APKs
        run: gradle assembleDebug
      - name: Collect APKs
        run: |
          mkdir -p output
          cp Kriolox/app/build/outputs/apk/debug/app-debug.apk output/Kriolox.apk
          cp KrioloxStudio/app/build/outputs/apk/debug/app-debug.apk output/Kriolox-Studio.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Kriolox-Android-APKs
          path: output/*.apk
          if-no-files-found: error
